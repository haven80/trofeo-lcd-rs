name: Sistema immagini
# Sposta le immagini finite per sbaglio nella cartella principale dentro img/.
# Si avvia a mano: scheda Actions -> "Sistema immagini" -> Run workflow.
# Dopo averlo usato puoi cancellare questo file.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sistema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sposta le immagini nella cartella img
        run: |
          mkdir -p img
          for f in *.png *.gif *.jpg *.jpeg; do
            [ -f "$f" ] || continue
            if [ -f "img/$f" ]; then
              # esiste già in img/: tengo quella e tolgo la copia nella radice
              git rm -q -- "$f"
            else
              git mv -- "$f" "img/$f"
            fi
          done
          git status --short | head -150
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Sposta le immagini nella cartella img" || echo "niente da fare"
          git push
