name: Release

# Builds trofeo_lcd.exe, trofeo_screen.exe and trofeo_config.exe natively on Windows and
# publishes them as downloadable assets on the GitHub Release for the tag
# that triggered the run.
#
# Trigger: publishing a Release on GitHub (Releases -> Draft a new release -> Publish).
# The build starts by itself and attaches the zip to that same Release.
# It can also be started by hand: Actions -> Release -> Run workflow, writing the tag
# of a Release that already exists (for example v2.25.0).
#
# Building here (instead of shipping a locally-built exe) means anyone can
# see, in the run's log, that the published binary was compiled straight
# from this exact commit's source — no hidden build step. It also makes the
# Windows Defender / SmartScreen false-positive situation a bit easier to
# reason about: a binary anyone can reproduce from public source and a
# public build log is easier to trust than one built on a random machine
# (see the note in README.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing Release (e.g. v2.25.0)"
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Assemble release package
        shell: bash
        run: |
          set -eu
          ver="${TAG#v}"
          out="trofeo-lcd-${ver}-windows"
          mkdir -p "$out"
          cp target/release/trofeo_lcd.exe "$out/"
          cp target/release/trofeo_screen.exe "$out/"
          cp target/release/trofeo_config.exe "$out/"
          cp README.md NOTICE.md LICENSE OPTIONS_GUIDE.md trofeo.conf.example "$out/"
          [ -f GUIDE_SECOND_MONITOR.md ] && cp GUIDE_SECOND_MONITOR.md "$out/"
          [ -d scripts ] && cp -r scripts "$out/"
          [ -d docs ] && cp -r docs "$out/"
          7z a "${out}.zip" "./${out}/*"
          echo "ASSET_PATH=${out}.zip" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
